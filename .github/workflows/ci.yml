name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Self-scan
        run: node dist/cli.js scan .

  # Runs this repository's own action against itself, built from source.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: skillward
        uses: ./
        with:
          version: local
          # Code scanning upload needs GitHub Advanced Security on private repositories.
          upload-sarif: "false"
      - name: Check outputs
        env:
          EXIT_CODE: ${{ steps.skillward.outputs.exit-code }}
          SARIF: ${{ steps.skillward.outputs.sarif-file }}
        run: |
          test "$EXIT_CODE" = 0
          test -s "$SARIF"
