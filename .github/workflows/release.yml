name: Release

# Publishes to npm when a version tag is pushed. Authentication is npm trusted publishing (OIDC): no npm token is
# stored in the repository. Configure it once on npmjs.com → skillward → Settings → Trusted publisher:
# GitHub Actions, owner "antshkvr", repository "skillward", workflow "release.yml".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag, package.json, action.yml and changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$TAG"
      - name: Check npm supports trusted publishing (>= 11.5.1)
        run: |
          v=$(npm --version)
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$v" \
            || { echo "npm $v is too old for trusted publishing"; exit 1; }
      # A version published by hand (the very first release) is not published again.
      - name: Check whether this version is already on npm
        id: registry
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "skillward@$version" version >/dev/null 2>&1; then
            echo "skillward@$version is already published; nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published == 'false'
        run: npm ci
      # prepublishOnly runs lint, tests and the build before the upload.
      - if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public
